<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c14" />
      <stop offset="50%" stop-color="#111726" />
      <stop offset="100%" stop-color="#1a0b12" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a3d" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161f33" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#0d1322" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="360" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />
  <rect width="1200" height="360" rx="14" fill="url(#grid)" />

  <!-- Top & Bottom Accent Bars -->
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#redAccent)" />
  <rect x="0" y="356" width="1200" height="4" rx="2" fill="url(#redAccent)" />

  <!-- Header Section -->
  <g transform="translate(48, 42)">
    <rect x="0" y="0" width="225" height="26" rx="13" fill="#2b1219" stroke="#ff2a3d" stroke-width="1.2" />
    <circle cx="15" cy="13" r="4.5" fill="#22c55e" />
    <text x="28" y="17" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#fca5a5" letter-spacing="1.2">CROW INNOVATIONS // LIVE</text>

    <text x="0" y="68" font-family="Orbitron, Inter, sans-serif" font-size="38" font-weight="900" fill="#f8fafc" letter-spacing="1.5">HAVOC 2.0 <tspan fill="#ff2a3d">REDTEAM</tspan> FRAMEWORK</text>
    <text x="0" y="96" font-family="Inter, sans-serif" font-size="15.5" fill="#94a3b8">Malleable Post-Exploitation Command &amp; Control — Upgraded for Modern GCC 16, C++20 Qt5/Qt6 &amp; MinGW-w64 Toolchains</text>
  </g>

  <!-- 4 Feature / Upgrade Cards -->
  <!-- Card 1 -->
  <g transform="translate(48, 162)">
    <rect width="260" height="156" rx="10" fill="url(#cardGrad)" stroke="#ff2a3d" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="18" y="30" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#ff2a3d">01 // GCC 16 &amp; MINGW-W64</text>
    <text x="18" y="54" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Modern Compiler Support</text>
    <text x="18" y="78" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Standardized -std=gnu17 &amp;</text>
    <text x="28" y="95" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">-fpermissive across builds</text>
    <text x="18" y="115" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Fixes GCC 14–16 strict C23</text>
    <text x="28" y="132" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">implant &amp; header failures</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(328, 162)">
    <rect width="260" height="156" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="18" y="30" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#38bdf8">02 // DEMON IMPLANT ENGINE</text>
    <text x="18" y="54" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Evasive x64 / x86 Payloads</text>
    <text x="18" y="78" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Ekko / Foliage / Cronos sleep</text>
    <text x="28" y="95" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">obfuscation &amp; indirect syscalls</text>
    <text x="18" y="115" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Verified EXE, DLL &amp; Shellcode</text>
    <text x="28" y="132" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">cross-compilation pipeline</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(608, 162)">
    <rect width="260" height="156" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="18" y="30" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#c084fc">03 // C++20 QT5 / QT6 CLIENT</text>
    <text x="18" y="54" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Hydrated Operator UI</text>
    <text x="18" y="78" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Auto-detects Qt6 &amp; Qt5 SDKs</text>
    <text x="18" y="98" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Automated dependency hydration</text>
    <text x="28" y="115" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">(spdlog, nlohmann/json, toml11)</text>
    <text x="18" y="135" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Native Linux &amp; WSL2 GUI build</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(888, 162)">
    <rect width="264" height="156" rx="10" fill="url(#cardGrad)" stroke="#22c55e" stroke-opacity="0.55" stroke-width="1.3" />
    <text x="18" y="30" font-family="JetBrains Mono, monospace" font-size="12" font-weight="700" fill="#4ade80">04 // CI VERIFICATION SUITE</text>
    <text x="18" y="54" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9">Automated Compiler Matrix</text>
    <text x="18" y="78" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Multi-version GCC 10–16 test</text>
    <text x="28" y="95" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">harness (summary.csv reports)</text>
    <text x="18" y="115" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">• Non-root CAP_NET_BIND_SERVICE</text>
    <text x="28" y="132" font-family="Inter, sans-serif" font-size="12" fill="#94a3b8">Go Teamserver execution</text>
  </g>
</svg>
